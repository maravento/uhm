# uhm - Web Configuration
# Main interface : http://localhost:4048/
# LogView tab    : http://localhost:4048/?tab=logview
# ACLView tab    : http://localhost:4048/?tab=aclview
# ToolView tab   : http://localhost:4048/?tab=toolview
#
# Each module is also reachable on its own, without the tab bar:
# http://localhost:4048/logview/, /aclview/ and /toolview/
#
# 4048/tcp has no IANA assignment. The panel is reachable only from
# loopback (e.g. a local Cloudflare Tunnel connecting to the origin),
# never directly from the LAN.

<VirtualHost *:4048>
    ServerName localhost
    ServerAdmin admin@localhost

    DocumentRoot /var/www/uhm
    DirectoryIndex index.html index.php

    <Directory /var/www/uhm>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require ip 127.0.0.1
        LimitRequestBody 1048576

        # Nothing outside the three module directories is served: the panel
        # has no data files of its own, so any other extension reaching this
        # vhost is a mistake.
        <FilesMatch "(?i)\.(env|ini|log|sh|sql|bak|backup|json|yaml|yml|key|pem|crt|conf|cfg|txt|sudoers)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory /var/www/uhm/logview>
        DirectoryIndex index.php
        Require ip 127.0.0.1
    </Directory>

    <Directory /var/www/uhm/aclview>
        DirectoryIndex index.php
        Require ip 127.0.0.1
    </Directory>

    <Directory /var/www/uhm/toolview>
        DirectoryIndex index.php
        Require ip 127.0.0.1
    </Directory>

    # Security headers
    # httpoxy (CVE-2016-5387): a client-supplied "Proxy:" header reaches PHP
    # as HTTP_PROXY, and many HTTP libraries obey it. Apache does not strip it
    # on its own, and this vhost serves api.php plus the three module pages.
    RequestHeader unset Proxy early
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options SAMEORIGIN
    Header always set Referrer-Policy strict-origin-when-cross-origin
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"

    # PHP
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    # Log
    ErrorLog ${APACHE_LOG_DIR}/uhm_error.log
    CustomLog ${APACHE_LOG_DIR}/uhm_access.log combined
</VirtualHost>
