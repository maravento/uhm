# uhm firewall switches, read by uhmiptables.sh on every reload
# Edited from the FWView tab. Values: on or off. on always means the rule applies
# Label: KEY: ACTION description. ACTION is ALLOW, DROP, LIMIT or MODE
# A missing key keeps its default. Changes apply on the next reload

# SQUID: MODE on: 3128/3129 intercept | off: direct 80/443
SQUID=on

# PING: ALLOW LAN to server and internet
PING=off

# BLOCKPORTS: DROP ports in blockports.txt
BLOCKPORTS=on

# SYNFLOOD: LIMIT new TCP connections
SYNFLOOD=on

# SMB: ALLOW file sharing 445 to server
SMB=on

# PRINTERS: ALLOW printers and scanners (incl. Epson ENPC)
PRINTERS=on

# CALLS: ALLOW STUN/TURN for Teams, Meet, Zoom, WebRTC
CALLS=on

# EMAIL: ALLOW IMAP, POP3, SMTP submission
EMAIL=on

# XMPP: ALLOW Jabber 5222/5223/5269, Google FCM 5228
XMPP=on

# NTP: ALLOW time sync to internet
NTP=on

# KMS: ALLOW Windows activation
KMS=on

# WUDO: LIMIT Windows Update sharing to the LAN
WUDO=on

# DISCOVERY: ALLOW mDNS, LLMNR, SSDP, WSD, IGMP
DISCOVERY=on

# WINDOWS: DROP NetBIOS, WS-Discovery, Windows hotspot
WINDOWS=on

# BYPASS: DROP GRE tunnels and CoAP
BYPASS=on

# BROADCAST: DROP mDNS, multicast, Spotify, Dropbox, Cisco
BROADCAST=on

# FINAL: DROP remaining LAN traffic (off opens the firewall)
FINAL=on
